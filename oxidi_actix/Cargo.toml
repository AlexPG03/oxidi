[package]
name = "oxidi_actix"
version = "0.7.0"
edition = "2024"
description = "Actix-web integration for the Oxidi zero-cost dependency injection framework"
license = "MIT"
repository = "https://github.com/AlexPG03/oxidi"
documentation = "https://docs.rs/oxidi_actix"
keywords = ["di", "dependency-injection", "actix", "actix-web", "extractor"]
