[package]
name = "oxidi_example_app"
version = "0.1.0"
edition = "2024"
publish = false


[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "axum_example"
path = "src/axum_example.rs"

[[bin]]
name = "scoped_example"
path = "src/scoped_example.rs"

[[test]]
name = "test_example"
path = "src/test_example.rs"

[[test]]
name = "test_with_module"
path = "src/test_with_module.rs"
required-features = ["test-support"]

[[test]]
name = "examples"
path = "src/examples.rs"
required-features = ["test-support"]

[features]
test-support = ["oxidi_core/test-support"]

[dependencies]
oxidi_core = { path = "../oxidi_core" }
oxidi_macros = { path = "../oxidi_macros" }
oxidi_axum = { path = "../oxidi_axum" }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
